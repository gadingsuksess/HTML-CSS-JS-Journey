<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Daily Plan</title>
    <!-- style css -->
    <link rel="stylesheet" href="styles/regis.css" />
    <!-- Google font api -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Icon api hugeicons -->
    <link
      rel="stylesheet"
      href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    />
</head>
<body>
    <!-- Container -->
    <div class="container">
        <!-- Logo -->
        <img src="img/Logo_Daily_Plan.png" alt="Logo Daily Plan" class="logo">
        <!-- Judul -->
        <h1>Daily Plan</h1>
        <!-- Deskripsi -->
        <p class="desc">Enter your email and password to create an account</p>

        <!-- form register -->
        <form onsubmit="tambahuser(event)">
            <!-- Input Nama -->
            <div class="input-login">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >
            </div>
            <!-- Input Email -->
            <div class="input-login">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>
            <!-- Input Password -->
            <div class="input-login">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            <!-- Input Confirm Password -->
            <div class="input-login">
                <label for="confirm">Confirm Password</label>
                <input
                    type="password"
                    id="confirm"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <!-- Tombol Register -->
            <div class="input-button">
                <button class="login-btn" type="submit">
                    Sign Up with Email
                </button>
            </div>
        </form>

        <!-- Link Login -->
        <p class="regis">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>
    <script src="script/regis.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Plan Checklist pages</title>
    <title>Dashboard Daily Plan</title>
    <!-- style css -->
    <link rel="stylesheet" href="styles/check-page.css" />
    <!-- Google font api -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Icon api hugeicons -->
    <link
      rel="stylesheet"
      href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    />
</head>
<body>
  <!-- Sidebar -->
    <aside>
      <nav>
        <div class="logo">
          <!-- Logo -->
            <img src="img/Logo_Daily_Plan.png" alt="Logo Daily Plan" />
            <h1>Daily Plan</h1>
        </div>
        <!-- Menu -->
        <ul>
            <li>
            <a href="dashboard.html"><i class="hgi hgi-stroke hgi-rounded hgi-dashboard-square-02"></i>Dashboard</a>
          </li>
          <li>
            <a href="note-page.html"><i class="hgi hgi-stroke hgi-rounded hgi-note-01"></i>Note</a>
          </li>
          <li>
            <a href="checklist-page.html"><i class="hgi hgi-stroke hgi-rounded hgi-check-list"></i>CheckList</a>
          </li>
          <li class="special">
            <a href="index.html"><i class="hgi hgi-stroke hgi-rounded hgi-login-square-01"></i>Logout</a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- main -->
    <main>
      <!-- Header -->
      <header>
        <div class="container-header">
          <!-- Tahun -->
            <div class="tahun">
                <button id="prevyear"><</button>
                <span id="yeartext">2026</span>
                <button id="nextyear">></button>
            </div>
            <!-- Profile -->
           <div class="header-profile">
            <div class="akun-pengguna">
                <i class="hgi hgi-stroke hgi-rounded hgi-user"></i>
                <span>Pak Mukti</span>
            </div>
          </div>
        </div>
      </header>

      <section>
        <div class="container-section">
            <div class="judul-keterangan">
                <h2>Checklist Mode</h2>
                <p>Silakan klik tanggal untuk mulai membuat checklist Anda</p>
            </div>
            <!-- Kalender -->
            <div class="kalender">
                <i class="hgi hgi-stroke hgi-rounded hgi-calendar-03"></i>
                <button id="prev"><</button>
                <span id="monthyear">Januari</span>
                <button id="next">></button>
            </div>
        </div>
      </section>

      <!-- Nama hari -->
      <section>
        <div class="week">
            <span style="color: red;">Min</span>
            <span>Sen</span>
            <span>Sel</span>
            <span>Rab</span>
            <span>Kam</span>
            <span>Jum</span>
            <span>Sab</span>
        </div>

        <!-- Tanffal -->
        <div class="day" id="days" ></div>
      </section>
    </main>
</body>
<script src="script/check-page.js"></script>
</html>

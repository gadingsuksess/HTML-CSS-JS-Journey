<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page Daily Plan</title>
    <!-- style css -->
    <link rel="stylesheet" href="styles/landing-page.css" />
    <!-- Google font api -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Icon api hugeicons -->
    <link
      rel="stylesheet"
      href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css"
    />
  </head>
  <body>
    <!-- Header -->
    <header>
      <!-- Header dengan logo dan tombol login/registrasi -->
      <div class="container-header">
        <!-- Logo dan nama aplikasi -->
        <div class="header-logo">
          <img
            src="img/Logo_Daily_Plan.png"
            alt="Logo Daily Plan"
            class="logo"
          />
          <h1>Daily Plan</h1>
        </div>
        <!-- Tombol login dan registrasi -->
        <div class="header-login-regis">
          <a href="login.html"><button class="login">Login</button></a>
          <a href="regis.html"><button class="regis">Sign Up</button></a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Bagian utama dengan gambar dan deskripsi aplikasi -->
      <div class="container">
        <!-- Isi text -->
        <div class="container-isi">
          <h2>Rencanakan Harimu Kendalikan Hidupmu</h2>
          <p>
            Membantu kamu mengatur jadwal, catat tugas, dan tingkatkan
            produktivitasmu dalam satu tempat yang simpel dan elegan.
          </p>
          <!-- Tombol ajakann -->
          <div class="button">
            <a href="regis.html"
              ><button class="get-started">Get Started. It's FREE</button></a
            >
            <p>Gratis Selamanya. Tanpa kartu kredit</p>
          </div>
        </div>
        <!-- Gambar -->
        <div class="container-gambar">
          <img src="img/Logo_main.png" alt="Gambar" />
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <!-- Footer dengan informasi kontak dan tautan sosial media -->
      <div class="footer">
        <p>&copy; 2026 Daily Plan. All rights reserved.</p>
        <div class="social-media">
          <!-- Tautan sosial media -->
          <a href="#"><i class="hgi hgi-stroke hgi-rounded hgi-mail-01"></i></a>
          <a href="#"><i class="hgi hgi-stroke hgi-rounded hgi-youtube"></i></a>
          <a href="#"
            ><i class="hgi hgi-stroke hgi-rounded hgi-facebook-01"></i
          ></a>
          <a href="#"
            ><i class="hgi hgi-stroke hgi-rounded hgi-new-twitter"></i
          ></a>
          <a href="#"
            ><i class="hgi hgi-stroke hgi-rounded hgi-linkedin-01"></i
          ></a>
        </div>
      </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas</title>
    <style>
        .container {
            position: relative;
            width: 700px;
            height: 400px;
            margin: auto;
            border: 4px solid teal;
            border-radius: 6px;
        }

        .gambar1 img {
            width: 200px;
            height: 100px;
            position: absolute;
            z-index: 9999;
            top: 200px;
            left: 100px;
        }

        .gambar2 img {
            width: 200px;
            height: 100px;
            position: absolute;
            top: 150px;
            left: 250px;
            z-index: 1;
        }

        .gambar3 img {
            width: 200px;
            height: 100px;
            position: absolute;
            top: 100px;
            left: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gambar1">
            <img src="image/danau.webp" alt="">
        </div>
        <div class="gambar2">
            <img src="image/pantai.jpg" alt="">
        </div>
        <div class="gambar3">
            <img src="image/pegunungan.jpg" alt="">
        </div>
    </div>
</body>
</html>

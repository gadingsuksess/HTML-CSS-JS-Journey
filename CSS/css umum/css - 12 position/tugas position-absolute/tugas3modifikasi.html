<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3</title>
    <style>
        .container {
            position: relative;
            margin: auto;
            width: 500px;
            height: 610px;
            background-color: lightgray;
            border-radius: 6px;
        }

        .header {
            position: absolute;
            top: 5px;
            left: 50px;
            background-color: coral;
            border-radius: 6px;
            text-align: center;
            width: 400px;
            height: 80px;
        }

        .navigation {
            position: absolute;
            top: 100px;
            left: 50px;
            background-color: coral;
            border-radius: 6px;
            text-align: center;
            width: 400px;
            height: 50px;
        }

        .content {
            position: absolute;
            top: 170px;
            left: 50px;
            background-color: coral;
            border-radius: 6px;
            text-align: center;
            width: 250px;
            height: 350px;
        }

        .sidebar {
            position: absolute;
            top: 170px;
            left: 310px;
            background-color: coral;
            border-radius: 6px;
            text-align: center;
            width: 140px;
            height: 350px;
        }

        .footer {
            position: absolute;
            top: 550px;
            left: 50px;
            background-color: coral;
            border-radius: 6px;
            text-align: center;
            width: 400px;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">HEADER</div>
        <div class="navigation">NAVIGATION</div>
        <div class="content">CONTENT</div>
        <div class="sidebar">SIDEBAR</div>
        <div class="footer">FOOTER</div>
    </div>
</body>
</html>

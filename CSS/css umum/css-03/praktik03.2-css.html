<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <style>
        body {
            text-align: center;
        }

        .none {
            text-decoration: none;
        }

        .underline {
            text-decoration: underline;
        }

        .overline {
            text-decoration: overline;
        }

        .line-through {
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <h1>Teks Decoration</h1>

    <a class="none" href="#">Link tanpa dekorasi garis bawah </a>
    <p class="underline">Paragraf dengan dekorasi garis bawah</p>
    <a class="overline" href="#" >Link dengan dekorasi garis diatas teks</a>
    <p class="line-through">Dekorasi teks tercoret</p>
</body>
</html>

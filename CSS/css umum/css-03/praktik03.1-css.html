<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Alignment</title>
    <style>
        .container {
            width: 1200px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            color: white;
        }

        header {
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .left {
            width: 300px;
            background-color: black;
            text-align: left;
            margin-right: auto;
            padding: 30px;
        }

        .center {
            width: 300px;
            background-color: black;
            text-align: center;
            margin: auto;
            padding: 30px;
        }

        .right {
            width: 300px;
            background-color: black;
            text-align: right;
            margin-left: auto;
            padding: 30px;
        }

        .justify {
            width: 100%;
            background-color: black;
            text-align: justify;
            padding: 30px;
        }
    </style>
</head>
<body>
    <header> Perataan Teks </header>
    <div class="container">
        <div class="left">
            Rata Kiri EA
        </div>

        <div class="center">
            Rata Tengah Dong
        </div>

        <div class="right">
            Rata Kanan Bos
        </div>

        <div class="justify">
            Rata Kanan dan Kiri heheheheheheheheheheh
        </div>
    </div>

</body>
</html>

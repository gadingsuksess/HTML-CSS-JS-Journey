<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teks Shadow</title>
    <style>
        h1 {
            font-size: 100px;
            text-align: center;
            color: white;
            text-transform: uppercase;
            animation: h1 1.5s infinite alternate;
        }

        @keyframes h1 {
        0%, 100% {
            text-shadow:
            0 0 5px #fff,
            0 0 15px #00a6ff,
            0 0 30px #00a6ff,
            0 0 60px #00a6ff;
        }
        50% {
            text-shadow:
            0 0 10px #fff,
            0 0 25px #00a6ff,
            0 0 50px #00a6ff,
            0 0 100px #00a6ff;
        }
        }
    </style>
</head>
<body>
    <h1>Teks Shadow</h1>
</body>
</html>

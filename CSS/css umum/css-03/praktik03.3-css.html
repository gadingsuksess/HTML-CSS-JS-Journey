<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teks Tranform</title>
    <style>
        body {
            text-align: center;
        }

        .upper {
            text-transform: uppercase;
            color: red;
        }

        .lower {
            text-transform: lowercase;
            color: green;
        }

        .capital {
            text-transform: capitalize;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Teks Transform</h1>
    <p class="upper">uppercase</p>
    <p class="lower">lowercase</p>
    <p class="capital">capitalize</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Font Style</title>
    <style>
        .px {
            font-size: 20px;
        }

        .persen {
            font-size: 150%;
        }

        .em {
            font-size: 2em;
        }

        .rem {
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <p class="px">Font style dengan satuan pixel (px)</p> 
    <p class="persen">Font style dengan satuan persen (%)</p>
    <p class="em">Font style dengan satuan em</p>
    <p class="rem">Font style dengan satuan rem</p>
</body>
</html>

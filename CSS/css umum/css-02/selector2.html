<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector dalam HTML</title>
    <style>
        * {
            margin: 10px;
        }
        /* Selektor tag */
        p {
            color: blue;
            font-size: 18px;
        }

        /* selektor class : biru */
        .biru {
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        /* Selektor id : merah */
        #merah {
            color: white;
            background-color: red;
            padding: 10px;
        }

        /* Selektor atribut */
        input[type="text"] {
            border: 2px solid green;
            padding: 5px;
            border: 1px solid cyan;
        }
    </style>
</head>
<body>
    <!-- Selector tag <p> -->
    <p>Ini adalah paragraf dalam halaman selektor.</p>

    <!-- Selektor class nama class : biru -->
    <div class="biru"></div>

    <!-- Selektor id nama id : merah -->
    <div id="merah">Ini adalah div dengan id merah</div>

    <!-- selektor atribut -->
    <input type="text" placeholder="Masukkan teks di sini">
</body>
</html>

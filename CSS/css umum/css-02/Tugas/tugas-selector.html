<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECTOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Selektor Tag <div> -->
    <div>
        Tag &lt;div&gt;
    </div>

    <!-- Selektor class : div -->
    <div class="div">
        class="div"
    </div>

    <!-- Selektor id : div -->
    <div id="div">
        id="div"
    </div>

    <!-- Selektor Universal -->
    <p>Universal Font Family</p>
</body>
</html>

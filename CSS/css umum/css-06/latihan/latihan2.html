<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 2</title>
    <style>
        body {
            width: 100%;
        }

        .kartu-profil {
            margin: auto;
            margin-top: 100px;
            width: 800px;
            border: 2px solid gray;
            border-radius: 15px;
            padding: 20px;
            height: 400px;
            background-color: #FAF9F6;
            display: flex;
            justify-content: space-between;
        }

        .profil {
            border: 2px solid black;
            border-radius: 6px;
            width: 200px;
            height: 300px;
            margin: auto;
            text-align: center;
        }

        .keterangan {
            border: 2px solid black;
            border-radius: 6px;
            width: 400px;
            height: 300px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="kartu-profil">
            <div class="profil">Bayangkan ini foto</div>
            <div class="keterangan">Bayangkan ini keterangan data pribadi</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan 1</title>
    <style>
        body {
            width: 1200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .solid {
            margin: auto;
            width: 400px;
            border: 4px solid black;
            padding: 100px;
        }

        .double {
            margin: auto;
            width: 400px;
            border: 4px double blue;
            padding: 100px;
        }

        .groove {
            margin: auto;
            width: 400px;
            border: 4px groove green;
            padding: 100px;
        }

        .ridge {
            margin: auto;
            width: 400px;
            border: 4px ridge red;
            padding: 100px;
        }
    </style>
</head>
<body>
    <div class="solid"></div>
    <div class="double"></div>
    <div class="groove"></div>
    <div class="ridge"></div>
</body>
</html>
